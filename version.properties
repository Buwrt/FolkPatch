# Single source of the FolkPatch manager version code.
# Read by build.gradle.kts, apd/build.rs, and GitHub Actions.
# This fork starts from a squashed snapshot of upstream, so `git rev-list --count`
# is far smaller than upstream's 2153 commits. The epoch is raised to keep
# versionCode = epoch + commitCount above managerVersionFloor (and above the
# latest upstream release 115051), otherwise `./gradlew printVersion` aborts
# with "Computed versionCode ... is not greater than managerVersionFloor".
managerVersionEpoch=115060
managerVersionFloor=115036
