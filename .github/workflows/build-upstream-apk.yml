name: Build upstream APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env

      - name: Point debug builds at the committed keystore
        run: |
          python3 scripts/ci-fix-signing.py
          ls -la app/debug.keystore
          grep -n signingConfig app/build.gradle.kts

      - name: Raise the version epoch above the floor
        run: |
          COUNT=$(git rev-list --count HEAD)
          EPOCH=$((115407 - COUNT))
          echo "commits=$COUNT epoch=$EPOCH -> versionCode=115407"
          sed -i "s/^managerVersionEpoch=.*/managerVersionEpoch=$EPOCH/" version.properties
          cat version.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log

      - name: Show build failure
        if: failure()
        run: |
          grep -E "^e: " gradle.log | head -25 | cut -c1-260 | sed 's/^/::error::/' || true
          awk "/What went wrong:/{f=1} f" gradle.log | head -20 | cut -c1-260 | sed 's/^/::error::/' || true

      - name: Re-sign with the fixed key
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          echo "found: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | head -1)
          if [ -z "$BT" ]; then
            BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ 2>/dev/null | head -1)
          fi
          echo "build-tools: $BT"
          ls "$BT" | head -20
          "${BT}zipalign" -f -p 4 "$APK" dist/aligned.apk
          "${BT}apksigner" sign \
            --ks app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out dist/FolkPatch-Debug.apk dist/aligned.apk
          "${BT}apksigner" verify --print-certs dist/FolkPatch-Debug.apk | head -25
          ls -la dist/
          test -s dist/FolkPatch-Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-store
          git add -f dist/FolkPatch-Debug.apk
          git commit -m "chore: store the upstream debug APK"
          git push -f origin apk-store

      - name: Store the APK
        run: |
          ls -la dist/
          test -s dist/FolkPatch-Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-store
          git add -f dist/FolkPatch-Debug.apk
          git commit -m "chore: store the upstream debug APK"
          git push -f origin apk-store
