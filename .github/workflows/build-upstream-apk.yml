          base64 -d /tmp/ks.b64 > app/debug.keystore
          ls -la app/debug.keystore

      - name: Point debug builds at it
        run: |
          awk 'BEGIN{c=0} { if ($0=="        debug {" && c==0) { print; print "            signingConfig = signingConfigs.getByName(\"release\")"; c=1; next } print }' app/build.gradle.kts > /tmp/bg.kts
          mv /tmp/bg.kts app/build.gradle.kts
          grep -n -A2 "^        debug {" app/build.gradle.kts

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log

      - name: Show build failure
        if: failure()
        run: |
          grep -E "^e: " gradle.log | head -25 | cut -c1-260 | sed 's/^/::error::/' || true
          awk '/What went wrong:/{f=1} f' gradle.log | head -20 | cut -c1-260 | sed 's/^/::error::/' || true

      - name: Store the APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          echo "found: $APK"
          cp "$APK" dist/FolkPatch-Debug.apk
          ls -la dist/
          test -s dist/FolkPatch-Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-store
          git add -f dist/FolkPatch-Debug.apk
          git commit -m "chore: store the upstream debug APK"
          git push -f origin apk-store
