name: cidbg
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
      - name: Build and capture log
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > /tmp/gradle.log 2>&1
          echo "exit=$?" >> /tmp/gradle.log
          set -e
      - name: Extract errors
        run: |
          mkdir -p ci-log
          { 
            echo "=== ERROR LINES ===";
            grep -nE "^e: |^w: .*error|error:|FAILED|Execution failed|What went wrong" /tmp/gradle.log | head -80;
            echo;
            echo "=== CONTEXT ===";
            grep -nE "^e: " /tmp/gradle.log | head -40 | while IFS=: read -r n rest; do
              echo "----- around line $n -----"
              sed -n "$((n>6?n-6:1)),$((n+6))p" /tmp/gradle.log
            done;
            echo;
            echo "=== TAIL ===";
            tail -120 /tmp/gradle.log;
          } > ci-log/errors.txt 2>&1 || true
          wc -l ci-log/errors.txt
      - name: Publish log to ci-log branch
        run: |
          set -e
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "ci-bot"
          git checkout -B ci-log
          git add -f ci-log/errors.txt
          git commit -m "ci: build log snapshot" || echo "nothing"
          git push -f origin ci-log
