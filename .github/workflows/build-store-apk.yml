name: Build and store APK

on:
  workflow_dispatch:
    inputs:
      keystore_base64:
        description: Base64 of the signing keystore
        required: true
      target_version:
        description: versionCode to report
        required: false
        default: "115407"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: debug.keystore
      KEYSTORE_PASSWORD: android
      KEY_ALIAS: androiddebugkey
      KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env

      - name: Restore the signing keystore
        run: |
          echo "${{ inputs.keystore_base64 }}" | base64 -d > app/debug.keystore
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Sign debug builds with that keystore
        run: |
          # The upstream tree gives the debug variant no signingConfig, so it
          # would fall back to the per-runner ~/.android/debug.keystore. Point
          # it at the keystore above instead. Done in the runner only - the
          # committed tree stays identical to upstream.
          python3 - <<'EOF'
          p='app/build.gradle.kts'
          s=open(p).read()
          old="        debug {\n            isDebuggable = true"
          new="        debug {\n            signingConfig = signingConfigs.getByName(\"release\")\n            isDebuggable = true"
          assert old in s, 'debug block not found'
          open(p,'w').write(s.replace(old,new,1))
          print('debug signingConfig added')
          EOF

      - name: Set versionCode
        run: |
          N=$(git rev-list --count HEAD)
          TARGET=${{ inputs.target_version }}
          EPOCH=$((TARGET - N))
          echo "commits=$N target=$TARGET epoch=$EPOCH"
          sed -i "s/managerVersionEpoch=.*/managerVersionEpoch=$EPOCH/" version.properties
          cat version.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log

      - name: Show build failure
        if: failure()
        run: |
          grep -E "^e: " gradle.log | head -25 | cut -c1-260 | sed 's/^/::error::/' || true
          awk '/What went wrong:/{f=1} f' gradle.log | head -20 | cut -c1-260 | sed 's/^/::error::/' || true

      - name: Store the APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          echo "found: $APK"
          cp "$APK" dist/FolkPatch-Debug.apk
          ls -la dist/
          test -s dist/FolkPatch-Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-store
          git add -f dist/FolkPatch-Debug.apk
          git commit -m "chore: store the debug APK"
          git push -f origin apk-store
