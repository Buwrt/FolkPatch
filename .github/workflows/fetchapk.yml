name: fetchapk
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RESTORE_TOKEN }}
      - name: Download existing artifact by id
        run: |
          set -e
          mkdir -p /tmp/art
          curl -sSL --retry 3 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11888920179/zip" \
            -o /tmp/art/a.zip
          ls -l /tmp/art/a.zip
          file /tmp/art/a.zip
          unzip -o -qq /tmp/art/a.zip -d /tmp/art/out || true
          find /tmp/art/out -name '*.apk' -exec ls -l {} \;
      - name: Commit apk to apk-out branch
        run: |
          set -e
          APK=$(find /tmp/art/out -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "no apk found"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/FolkPatch-Debug-hidelist.apk"
          ls -l "$GITHUB_WORKSPACE/FolkPatch-Debug-hidelist.apk"
          sha256sum "$GITHUB_WORKSPACE/FolkPatch-Debug-hidelist.apk"
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git checkout -B apk-out
          git add -f FolkPatch-Debug-hidelist.apk
          git commit -m "chore: publish debug apk artifact for download" || echo "nothing"
          git push -f origin apk-out
