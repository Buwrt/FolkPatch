name: Vendor bundled KPMs

# Downloads the two bundled KPMs and commits them into the repository so the
# APK build never depends on a network fetch at build time.
#
# Verification matters: `.gitattributes` used to contain `* text eol=lf`, which
# stripped 0x0D bytes out of these binaries on `git add` (Nohello.kpm lost 56).
# A corrupted KPM is loaded at pre-kernel-init, i.e. before anything can
# recover, so the final step re-clones and byte-compares before declaring done.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-kpms.yml'

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download bundled KPMs
        run: |
          set -x
          cd app/src/main/assets
          for f in Nohello.kpm selinux_magisk_access_filter.kpm; do
            rm -f "$f"
            curl -fsSL --retry 5 --retry-delay 2 \
              "https://github.com/Buwrt/meituan/releases/download/V1/$f" -o "$f"
            [ -s "$f" ] || { echo "::error::$f download failed"; exit 1; }
            echo "$f $(stat -c%s "$f") bytes"
          done
          sha256sum Nohello.kpm selinux_magisk_access_filter.kpm > /tmp/want.txt
          cat /tmp/want.txt

      - name: Commit vendored KPMs
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `*.bat eol=crlf` leaves these modified right after checkout, which
          # makes a plain pull --rebase refuse to run. Restore only those: a
          # blanket `git checkout -- .` would overwrite the payload we just
          # staged with the corrupted blob already in the index.
          git checkout -- Build-Debug.bat Build-Release.bat gradlew.bat 2>/dev/null || true
          git pull --rebase --autostash origin main || true
          git add -f app/src/main/assets/Nohello.kpm \
                    app/src/main/assets/selinux_magisk_access_filter.kpm
          if git diff --cached --quiet; then
            echo "already vendored, nothing to commit"
          else
            git commit -m "chore: vendor bundled KPMs into the repository [skip ci]"
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || sleep 10
          done

      - name: Verify committed blobs are byte-identical
        run: |
          set -e
          rm -rf /tmp/verifykpm
          git clone --depth 1 https://github.com/Buwrt/FolkPatch.git /tmp/verifykpm
          cd /tmp/verifykpm/app/src/main/assets
          sha256sum Nohello.kpm selinux_magisk_access_filter.kpm > /tmp/got.txt
          {
            echo "=== expected (upstream) vs committed ==="
            diff /tmp/want.txt /tmp/got.txt && echo "ALL OK" || echo "MISMATCH"
          } > /tmp/verifykpm.txt 2>&1
          cat /tmp/verifykpm.txt
          ! grep -q MISMATCH /tmp/verifykpm.txt

      - name: Publish verdict
        if: always()
        run: |
          cp /tmp/verifykpm.txt VERIFY_KPM.txt 2>/dev/null || echo "no verify output" > VERIFY_KPM.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f VERIFY_KPM.txt
          git commit -m "chore: KPM verification [skip ci]" || echo "no change"
          git pull --rebase origin main || true
          git push || echo "push failed"
