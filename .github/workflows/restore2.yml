name: restore2
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        run: |
          set -e
          mkdir -p /tmp/full
          curl -sSL --retry 3 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/639449544" \
            -o /tmp/full.zip
          ls -l /tmp/full.zip
          unzip -qq /tmp/full.zip -d /tmp/full
          echo "--- 解压后顶层(含隐藏) ---"
          ls -a /tmp/full
      - name: Replace tree with FULL source including dotfiles
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/full/. "$GITHUB_WORKSPACE"/
          echo "--- 恢复后顶层 ---"
          ls -a "$GITHUB_WORKSPACE"
          echo "--- .github/workflows ---"
          ls "$GITHUB_WORKSPACE/.github/workflows"
      - name: Commit and push to main
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.email "restore-bot@users.noreply.github.com"
          git config user.name "restore-bot"
          git add -A
          git status --short | head -15
          git commit -m "restore: full FolkPatch source from release asset (incl dotfiles)" || echo "nothing to commit"
          git push origin HEAD:main
