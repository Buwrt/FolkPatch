name: restore5
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RESTORE_TOKEN }}
      - name: Download release asset
        run: |
          set -e
          mkdir -p /tmp/full
          curl -sSL --retry 3 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/639449544" \
            -o /tmp/full.zip
          ls -l /tmp/full.zip
          sha256sum /tmp/full.zip
          unzip -qq /tmp/full.zip -d /tmp/full
          ls -a /tmp/full > /tmp/t.txt
          cat /tmp/t.txt
      - name: Replace tree with full source including dotfiles
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/full/. "$GITHUB_WORKSPACE"/
          ls -a > /tmp/a.txt
          cat /tmp/a.txt
          ls .github/workflows > /tmp/w.txt 2>/dev/null || true
          cat /tmp/w.txt
      - name: Commit and push to main
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.email "restore-bot@users.noreply.github.com"
          git config user.name "restore-bot"
          git add -A
          git status --short > /tmp/st.txt 2>&1 || true
          wc -l < /tmp/st.txt
          git commit -m "restore: full FolkPatch source (incl .github) from release asset" || echo "nothing to commit"
          git push origin HEAD:main
