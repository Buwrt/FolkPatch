name: fetchapk2
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RESTORE_TOKEN }}
      - name: Download artifact by id
        run: |
          set -e
          mkdir -p /tmp/art
          curl -sSL --retry 3 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11899011189/zip" \
            -o /tmp/art/a.zip
          ls -l /tmp/art/a.zip
          unzip -o -qq /tmp/art/a.zip -d /tmp/art/out || true
          find /tmp/art/out -name '*.apk' -exec ls -l {} \;
      - name: Commit apk to apk-out branch
        run: |
          set -e
          APK=$(find /tmp/art/out -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "no apk"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/FolkPatch-HMA-mode.apk"
          ls -l "$GITHUB_WORKSPACE/FolkPatch-HMA-mode.apk"
          sha256sum "$GITHUB_WORKSPACE/FolkPatch-HMA-mode.apk"
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git checkout -B apk-out
          git add -f FolkPatch-HMA-mode.apk
          git commit -m "chore: publish apk for download" || echo nothing
          git push -f origin apk-out
