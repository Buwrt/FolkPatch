name: Build FolkPatch

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'apd/**'
      - 'fpd/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'apd/**'
      - 'fpd/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options: [ both, debug, release ]

env:
  KEYSTORE_FILE: debug.keystore
  KEYSTORE_PASSWORD: android
  KEY_ALIAS: androiddebugkey
  KEY_PASSWORD: android

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_debug: ${{ steps.set.outputs.debug }}
      build_release: ${{ steps.set.outputs.release }}
      commit_msg: ${{ steps.msg.outputs.text }}
      commit_author: ${{ steps.msg.outputs.author }}
      artifact_list: ${{ steps.set.outputs.artifact_list }}

    steps:
      - id: set
        run: |
          TYPE="${{ inputs.build_type }}"
          [ "${{ github.event_name }}" != "workflow_dispatch" ] && TYPE="both"

          DEBUG="false"; RELEASE="false"; LIST=""
          [ "$TYPE" = "both" -o "$TYPE" = "debug" ] && { DEBUG="true"; LIST="folkpatch-debug-${{ github.sha }}"; }
          [ "$TYPE" = "both" -o "$TYPE" = "release" ] && {
            RELEASE="true"
            [ -n "$LIST" ] && LIST="$LIST," || true
            LIST="${LIST}folkpatch-release-${{ github.sha }}"
          }

          echo "debug=$DEBUG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "artifact_list=$LIST" >> "$GITHUB_OUTPUT"

      - id: msg
        run: |
          case "${{ github.event_name }}" in
            push)         TEXT="${{ github.event.head_commit.message }}"
                           AUTHOR="${{ github.event.head_commit.author.name }}" ;;
            pull_request) TEXT="PR: ${{ github.event.pull_request.title }}"
                           AUTHOR="${{ github.event.pull_request.user.login }}" ;;
            *)            TEXT="FolkPatch Build"
                           AUTHOR="${{ github.actor }}" ;;
          esac
          TEXT="${TEXT%%$'\n'*}"
          echo "text=$TEXT" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

  build_debug:
    name: Build Debug
    needs: prepare
    if: needs.prepare.outputs.build_debug == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env

      - name: Verify version
        run: ./gradlew printVersion --no-daemon

      # Sign every build with the keystore committed at the repo root. KernelPatch
      # bakes the manager certificate into the patched boot image, so a signature
      # that changes between builds makes the manager report "not patched" even
      # though the boot image is patched. The keystore uses the standard debug
      # identity (alias androiddebugkey, password android) so the debug build
      # picks it up from ~/.android and the release build reads it through
      # keystore.properties.
      - name: Configure keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > folkpatch.jks
            {
              echo "KEYSTORE_FILE=../folkpatch.jks"
              echo "KEYSTORE_PASSWORD=$KS_PWD"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KS_KEY_PWD"
            } > keystore.properties
          else
            {
              echo "KEYSTORE_FILE=../folkpatch.jks"
              echo "KEYSTORE_PASSWORD=android"
              echo "KEY_ALIAS=androiddebugkey"
              echo "KEY_PASSWORD=android"
            } > keystore.properties
          fi
          mkdir -p "$HOME/.android"
          cp folkpatch.jks "$HOME/.android/debug.keystore"

      - name: Capture version code
        id: version
        run: |
          VC=$(./gradlew printVersion --no-daemon | grep -m1 "Version code:" | grep -oE '[0-9]+' | head -1)
          echo "code=${VC:-0}" >> "$GITHUB_OUTPUT"

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Show Gradle failure
        if: failure()
        run: |
          grep -nE "^e: |FAILED|Execution failed|What went wrong|Caused by" gradle-build.log | head -25 | cut -c1-400 | sed 's/^/::error::/' || true
          tail -50 gradle-build.log | cut -c1-300 | sed 's/^/::error::/' || true


      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Rename APK
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          [ -n "$APK" ] && mv "$APK" "FolkPatch-Debug-${SHORT}.apk"

      - name: Print APK signing certificate
        run: |
          APK=$(find . -maxdepth 1 -name "FolkPatch-Debug-*.apk" | head -1)
          echo "debug cert: $(unzip -p "$APK" META-INF/*.RSA | keytool -printcert | grep -m1 'SHA256:')"

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-debug-${{ github.sha }}
          path: FolkPatch-Debug-*.apk
          retention-days: 30

  build_release:
    name: Build Release
    needs: prepare
    if: needs.prepare.outputs.build_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env

      - name: Verify version
        run: ./gradlew printVersion --no-daemon

      # No signing secret is configured on this fork, so generate a throwaway
      # keystore instead of feeding an empty file to the release build.
      # Sign every build with the keystore committed at the repo root. KernelPatch
      # bakes the manager certificate into the patched boot image, so a signature
      # that changes between builds makes the manager report "not patched" even
      # though the boot image is patched. The keystore uses the standard debug
      # identity (alias androiddebugkey, password android) so the debug build
      # picks it up from ~/.android and the release build reads it through
      # keystore.properties.
      - name: Configure keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > folkpatch.jks
            {
              echo "KEYSTORE_FILE=../folkpatch.jks"
              echo "KEYSTORE_PASSWORD=$KS_PWD"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KS_KEY_PWD"
            } > keystore.properties
          else
            {
              echo "KEYSTORE_FILE=../folkpatch.jks"
              echo "KEYSTORE_PASSWORD=android"
              echo "KEY_ALIAS=androiddebugkey"
              echo "KEY_PASSWORD=android"
            } > keystore.properties
          fi
          mkdir -p "$HOME/.android"
          cp folkpatch.jks "$HOME/.android/debug.keystore"

      - name: Assemble release
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle-build.log

      - name: Show Gradle failure
        if: failure()
        run: |
          grep -nE "^e: |FAILED|Execution failed|What went wrong|Caused by" gradle-build.log | head -25 | cut -c1-400 | sed 's/^/::error::/' || true
          tail -50 gradle-build.log | cut -c1-300 | sed 's/^/::error::/' || true

      - run: ./gradlew assembleRelease --no-daemon

      - name: Debug APK location
        run: find app/build/outputs -name "*.apk" -type f || echo "No APK found"

      - name: Rename APK
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          [ -n "$APK" ] && mv "$APK" "FolkPatch-Release-${SHORT}.apk"

      - name: Print APK signing certificate
        run: |
          APK=$(find . -maxdepth 1 -name "FolkPatch-Release-*.apk" | head -1)
          echo "RELEASE_SIGNATURE=$(unzip -p "$APK" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -m1 "SHA256:")"
          echo "release cert: $(unzip -p "$APK" META-INF/*.RSA | keytool -printcert | grep -m1 'SHA256:')"

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-release-${{ github.sha }}
          path: FolkPatch-Release-*.apk
          retention-days: 30

  upload:
    name: Upload to Telegram
    needs: [prepare, build_debug, build_release]
    if: always() && needs.prepare.result == 'success' && (needs.build_debug.result == 'success' || needs.build_release.result == 'success') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram config
        id: tg_check
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Telegram secrets not configured, skipping upload"
          fi

      - name: Download artifacts
        if: steps.tg_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: folkpatch-*
          path: artifacts
          merge-multiple: true

      - name: Send to Telegram
        if: steps.tg_check.outputs.enabled == 'true'
        run: |
          FILES=$(find artifacts -type f 2>/dev/null | sort)
          FILE_COUNT=$(echo "$FILES" | grep -c . || true)
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No files found in artifacts"
            exit 1
          fi
          
          CAPTION="${{ needs.prepare.outputs.commit_msg }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ needs.prepare.outputs.commit_author }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "$FILE_COUNT" -eq 1 ]; then
            curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F "document=@$FILES" \
              -F "caption=${CAPTION}"
          else
            FILE_ARR=()
            while IFS= read -r f; do
              FILE_ARR+=("$f")
            done <<< "$FILES"
            
            TOTAL=${#FILE_ARR[@]}
            MEDIA_JSON="["
            for i in "${!FILE_ARR[@]}"; do
              FNAME=$(basename "${FILE_ARR[$i]}")
              if [ $i -gt 0 ]; then
                MEDIA_JSON+=","
              fi
              if [ $((i + 1)) -eq $TOTAL ]; then
                MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://$FNAME\",\"caption\":\"${CAPTION}\"}"
              else
                MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://$FNAME\"}"
              fi
            done
            MEDIA_JSON+="]"
            
            ARGS=(-X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMediaGroup")
            ARGS+=(-F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}")
            ARGS+=(-F "media=${MEDIA_JSON}")
            
            while IFS= read -r f; do
              FNAME=$(basename "$f")
              ARGS+=(-F "$FNAME=@$f")
            done <<< "$FILES"
            
            curl -sf "${ARGS[@]}"
          fi

  publish_release:
    name: Publish APKs to Releases
    needs: [prepare, build_debug, build_release]
    if: always() && needs.prepare.result == 'success' && (needs.build_debug.result == 'success' || needs.build_release.result == 'success') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: folkpatch-*
          path: artifacts
          merge-multiple: true

      - name: Create release with APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          VC="${{ needs.build_debug.outputs.version_code }}"
          # Tag with the version code so the in-app update check can compare it
          # against BuildConfig.VERSION_CODE.
          if [ -n "$VC" ] && [ "$VC" != "0" ]; then TAG="v${VC}"; else TAG="build-${SHORT}"; fi
          FILES=$(find artifacts -type f -name "*.apk" | sort)
          [ -z "$FILES" ] && { echo "::error::no apk found"; exit 1; }

          # Proof that the bundled modules really are inside the APK, not
          # fetched at runtime.
          NOTES="Automated build of ${GITHUB_SHA}."
          NOTES="${NOTES}"$'\n\n'"Bundled KPMs are embedded into every patched boot.img."
          NOTES="${NOTES}"$'\n\n'"## Bundled KPMs (inside the APK)"$'\n'"\`\`\`"
          for APK in $FILES; do
            NOTES="${NOTES}"$'\n'"$(basename "$APK"):"
            NOTES="${NOTES}"$'\n'"$(unzip -l "$APK" | grep -E 'assets/(Nohello|selinux_magisk_access_filter)\.kpm' || echo '  MISSING')"
          done
          NOTES="${NOTES}"$'\n'"\`\`\`"

          gh release create "$TAG" $FILES \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "FolkPatch ${VC:-$SHORT}" \
            --notes "$NOTES"
