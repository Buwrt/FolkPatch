name: dbg3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
      - name: Build
        run: |
          set +e; ./gradlew assembleDebug --no-daemon > /tmp/g.log 2>&1; echo "exit=$?" >> /tmp/g.log; set -e
      - name: Extract
        run: |
          mkdir -p ci-log
          { echo "=== ERRORS ==="; grep -nE "^e: |FAILED" /tmp/g.log | head -40; } > ci-log/e.txt || true
      - name: Publish
        run: |
          set -e; git config user.email b@u.noreply.github.com; git config user.name b
          git checkout -B dbg-log; git add -f ci-log/e.txt; git commit -m ci || echo none; git push -f origin dbg-log
